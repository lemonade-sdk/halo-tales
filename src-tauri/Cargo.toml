[package]
name = "halo-tales"
version = "0.1.0"
description = "HaloTales — local-AI creative roleplaying"
edition = "2021"
rust-version = "1.77"

[lib]
name = "halo_tales_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
zip = "2"
flate2 = "1"
tar = "0.4"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
rand = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
